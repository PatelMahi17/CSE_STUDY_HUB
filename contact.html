 </header>
 <main class="page-content">
 <section id="contact" class="contact-page">
 <h2 class="pre-fade-in">Get in Touch</h2>
 <p class="contact-intro-text pre-fade-in">Have questions, feedback, or need support? Reach out to us!</p>
 <div class="contact-info pre-fade-in">
 <div class="info-item"><i class="fas fa-map-marker-alt"></i><span>123 Study Lane, Knowledge City, India</span></div>
 <div class="info-item"><i class="fas fa-envelope"></i><span>info@csestudyhub.com</span></div>
 <div class="info-item"><i class="fas fa-phone"></i><span>+91 9876543210</span></div>
 </div>

 <div class="contact-form-container pre-fade-in">
 <h3>Send Us a Message</h3>
 <form id="contactForm" class="contact-form">
 <div class="form-group">
 <label for="name">Name:</label>
 <input type="text" id="name" name="name" required placeholder="Your Name">
 <div class="error-message" id="nameError"></div>
 </div>

<div class="form-group">
 <label for="email">Email:</label>
 <input type="email" id="email" name="email" required placeholder="your.email@example.com">
<div class="error-message" id="emailError"></div>
 </div>

 <div class="form-group">
 <label for="message">Message:</label>
 <textarea id="message" name="message" rows="6" required placeholder="Type your message here..."></textarea>
 <div class="error-message" id="messageError"></div>
 </div>
 <button type="submit" class="btn">Send Message</button>
 <div class="form-submission-message" id="formMessage"></div>
 </form>
 </div>
 <div class="social-links pre-fade-in">
<a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
<a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
 <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
 </div>
 </section>
</main>
